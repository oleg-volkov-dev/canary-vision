[project]
name = "canary-vision"
version = "0.1.0"
description = "A reproducible CPU image classification lab."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "pillow==12.3.0",
    "python-multipart==0.0.32",
    "torch==2.9.1",
    # The official index names the ARM wheel without '+cpu'.
    "torchvision==0.24.1; sys_platform == 'darwin' or platform_machine == 'aarch64'",
    "torchvision==0.24.1+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.7"]
browser = ["playwright==1.62.0"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses the real, predownloaded MobileNet model"]
